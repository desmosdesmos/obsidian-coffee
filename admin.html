<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>404 — Страница не найдена</title>
  <style>
    body {
      background: #0d0c0b;
      color: #9c948b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      max-width: 420px;
      padding: 30px;
    }
    h1 {
      font-size: 3.5rem;
      color: #fff;
      margin: 0 0 12px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a {
      display: inline-block;
      padding: 11px 26px;
      background: #181513;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    a:hover {
      background: #222;
      border-color: #fff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Запрашиваемый документ не найден на сервере или был перемещен.</p>
    <a href="index.html">← Перейти на главную</a>
  </div>
</body>
</html>
